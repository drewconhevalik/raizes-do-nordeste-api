spring.application.name=raizes-do-nordeste-api

# Banco de dados: H2 em memória para demonstração e testes.
# Em produção, trocar por PostgreSQL via variáveis de ambiente (ver docs/03-arquitetura.md).
spring.datasource.url=jdbc:h2:mem:raizes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Respostas de erro no formato Problem Details (RFC 9457)
spring.mvc.problemdetails.enabled=true

# Token JWT. O segredo de produção deve vir da variável de ambiente JWT_SEGREDO.
app.jwt.segredo=${JWT_SEGREDO:dev-segredo-raizes-do-nordeste-trocar-em-producao-2026}
app.jwt.validade-minutos=120

# Segredo compartilhado com o serviço de pagamento para aceitar o webhook
app.gateway.token-webhook=${GATEWAY_TOKEN:dev-token-webhook}

# Health check (usado pelo balanceador de carga)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
